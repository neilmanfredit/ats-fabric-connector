name: afc-release

on:
  push:
    tags:
      - "afc-v*-alpha.*"

permissions:
  contents: read

env:
  INGESTR_DISABLE_TELEMETRY: "true"
  DISABLE_TELEMETRY: "true"
  IMAGE: ghcr.io/neilmanfredit/ats-fabric-connector

jobs:
  ci:
    uses: ./.github/workflows/afc-ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Check attribution on release notes
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: fabric/scripts/check-attribution.sh env NOTES

      - name: Resolve version tags
        id: vars
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: fabric/deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha }}
          build-args: |
            INGESTR_DISABLE_TELEMETRY=true
            DISABLE_TELEMETRY=true

      - name: Generate software bill of materials
        uses: anchore/sbom-action@f6c3d0fe42c3cf876e3462574e4c9416b5e0f07a # v0.9.0
        with:
          image: ${{ env.IMAGE }}:${{ steps.vars.outputs.version }}
          artifact-name: sbom-${{ steps.vars.outputs.version }}.spdx.json
          output-file: sbom-${{ steps.vars.outputs.version }}.spdx.json

      - name: Publish pre-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          prerelease: true
          generate_release_notes: true
          files: sbom-${{ steps.vars.outputs.version }}.spdx.json
