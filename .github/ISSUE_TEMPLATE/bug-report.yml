name: Bug report
description: Report a bug in ats-fabric-connector.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste real Bullhorn data, credentials, tenant identifiers,
        workspace/lakehouse names, or screenshots containing records
        anywhere in this form.** Reproduce with the mocked test fixtures
        under `pkg/source/bullhorn/testdata/` where possible, or describe
        the shape of the data rather than including it.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands run, configuration used (with secrets redacted), and any error output.
      placeholder: |
        1. `go run . ingest --source-uri "bullhorn://?..." --source-table candidate ...`
        2. Observed error: ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse HEAD` or the release tag.
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I have not included any real Bullhorn data, credentials, tenant identifiers, or screenshots containing records in this report.
          required: true
